name: Robo Comenta LINK
on:
  schedule:
    - cron: "*/15 10-23,0-2 * * *"
  workflow_dispatch: {}
concurrency: { group: vydescontos, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  responder:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python motor/comentarios.py
      - run: |
          git config user.name "motor-ofertas"
          git config user.email "motor@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -q -m "Comentarios respondidos" && git pull --rebase -q && git push)
